apiVersion: v1
kind: Pod
metadata:
  annotations:
    io.podman.annotations.kube.health.check/traefik-traefik: "true"
  name: traefik
  labels:
    app: traefik
spec:
  containers:
    - name: traefik
      image: docker.io/library/traefik:v3.6
      args:
        - "--configFile=/etc/traefik/traefik.yaml"
      ports:
        - port: 80
          hostPort: 80
          protocol: TCP
        - port: 443
          hostPort: 443
          protocol: TCP
        - port: 8080
          hostPort: 8080
          protocol: TCP
      resources:
        limits:
          cpu: 0.2
          memory: "150Mi"
      volumeMounts:
      - mountPath: /etc/traefik
        #subPath: traefik.yaml
        name: traefik-config
      - mountPath: /dynamic/:z
        name: dynamic-config
      - mountPath: /certs/:z
        name: certificates
      - mountPath: /var/run/docker.sock:z
        name: docker-sock

    - name: tailscale
      image: docker.io/tailscale/tailscale:latest
      securityContext:
        privileged: true
        capabilities:
          add:
            - NET_ADMIN
            - NET_RAW
      env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-secret
              key: auth-key
        - name: TS_STATE_DIR
          value: /var/lib/tailscale
        - name: TS_USERSPACE
          value: "true"
        - name: TS_ACCEPT_DNS
          value: "false"
      volumeMounts:
        - name: lib-volume
          mountPath: /var/lib/tailscale
        - name: vpn-device
          mountPath: /dev/net/tun
  restartPolicy: unlessStopped
  dnsPolicy: Default

  volumes:
    - name: traefik-config
      configMap:
        name: traefik-config
        items:
          - key: traefik.yaml
            path: traefik.yaml
    - name: dynamic-config
      configMap:
        name: traefik-dynamic-config
    - name: certificates
      hostPath:
        path: /volume1/certs/
        type: Directory
    - name: docker-sock
      hostPath:
        path: "/run/user/1001/podman/podman.sock"
        type: File

    # Tailscale volumes
    - name: config-volume
      hostPath:
        path: /volume2/containers/tailscale/config/
        type: Directory
      readOnly: true
    - name: lib-volume
      hostPath:
        path: /volume2/containers/tailscale/lib/
        type: Directory
    - name: vpn-device
      hostPath:
        path: /dev/net/tun
        type: CharDevice
