apiVersion: v1
kind: Pod
metadata:
  annotations:
    io.podman.annotations.kube.health.check/traefik-traefik: "true"
  name: traefik
  labels:
    app: traefik
spec:
  containers:
    - name: traefik
      image: docker.io/library/traefik:v3.6
      args:
        - "--configFile=/etc/traefik/traefik.yaml"
      ports:
        - port: 80
          hostPort: 80
          protocol: TCP
        - port: 443
          hostPort: 443
          protocol: TCP
        - port: 8080
          hostPort: 8080
          protocol: TCP
      volumeMounts:
      - mountPath: /etc/traefik
        subPath: traefik.yaml
        name: traefik-config
      - mountPath: /dynamic/:z
        name: dynamic-config
      - mountPath: /certs/:z
        name: certificates
      - mountPath: /var/run/docker.sock:z
        name: docker-sock
  restartPolicy: Always
  dnsPolicy: Default
  volumes:
    - name: traefik-config
      configMap:
        name: traefik-config
        items:
          - key: traefik.yaml
            path: traefik.yaml
    - name: dynamic-config
      configMap:
        name: traefik-dynamic-config
    - name: certificates
      hostPath:
        path: /volume1/certs/
        type: Directory
    - name: docker-sock
      hostPath:
        path: "/run/user/1001/podman/podman.sock"
        type: File

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
data:
  traefik.yaml: |
    entryPoints:
      web:
        address: ":80"
        http:
          redirections:
            entrypoint:
              to: "websecure"
              scheme: "https"
              permanent: "true"
      websecure:
        address: ":443"
        http:
          tls: true
      traefik:
        address: ":8080"

    # Activate dashboard
    api:
      dashboard: true
      insecure: false

    # Watch dynamic configuration folder
    providers:
      docker:
        endpoint: "unix:///var/run/docker.sock"
        exposedByDefault: false
      file:
        directory: /dynamic
        watch: true

    # Logging + Acceslog for debug purposes
    log:
      filePath: "/etc/traefik/traefik.log"
      format: common
      level: DEBUG
    accessLog:
      format: json
      filters:
        statusCodes:
          - "200"
          - "400-404"
          - "500-503"
      fields:
        names:
          ClientUsername: drop
        headers:
          defaultMode: keep
          names:
            User-Agent: redact
            Content-Type: keep

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic-config
data:
  dashboard.yaml: |
    http:
      routers:
        dashboard:
          rule: Host(`dashboard.traefik.lan`)
          entryPoints:
            - websecure
          service: api@internal
          middlewares: secure-headers
          tls: {}

  tls.yaml: |
    tls:
       certificates:
         - certFile: ../certs/traefik-fullchain.crt
           keyFile: ../certs/traefik.key
         - certFile: ../certs/jellyfin.crt
           keyFile: ../certs/jellyfin.key
         - certFile: ../certs/arr-stack-fullchain.crt
           keyFile: ../certs/arr-stack.key

       stores:
        default:
          defaultCertificate:
            certFile: ../certs/traefik-fullchain.crt
            keyFile: ../certs/traefik.key

  middlewares.yaml: |
    http:
       middlewares:
         secure-headers:
           headers:
             contentTypeNosniff: true
             customFrameOptionsValue: SAMEORIGIN
