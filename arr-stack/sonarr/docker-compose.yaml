---
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.15
    container_name: sonarr
    restart: unless-stopped  
    env_file: ".env"
    networks:
      - traefik
    volumes:
      - ${CONFIG_PATH}:/config
      - ${SHOWS_PATH}:/tv
      - ${DOWNLOAD_PATH}:/downloads
    ports:
      - 8989:8989

networks:
  traefik:
    name: traefik
    external: true
